##
# Compression for the ERP. Install to /etc/nginx/conf.d/erp-gzip.conf
#
#   sudo cp deploy/nginx/erp-gzip.conf /etc/nginx/conf.d/erp-gzip.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Why this is a separate file rather than edits to sites-available/erp: that
# file is managed by Certbot (TLS blocks) and also carries the Next.js
# /website proxy. Dropping a new conf.d file touches neither.
#
# Note there is deliberately NO `gzip on;` here. Ubuntu's /etc/nginx/nginx.conf
# already sets it in the http context and nginx rejects a duplicate flag
# directive in the same context. What nginx.conf leaves commented out is
# gzip_types — which is why only text/html was ever compressed and every CSS and
# JS file shipped uncompressed.
#
# Measured on this app's public/ directory: 7,330 KB of compressible assets
# become 1,434 KB, an 80% reduction. adminlte.min.css alone goes 1,364 KB -> 127 KB.
##

gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;

gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/vnd.ms-fontobject
    application/x-font-ttf
    font/opentype
    image/svg+xml
    image/x-icon;

# jpg/png/webp/woff2 are already compressed and are deliberately absent —
# gzipping them costs CPU for no gain.
