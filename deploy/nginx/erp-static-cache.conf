##
# Cache headers for the ERP's static assets.
#
# Install as a snippet and include it inside the existing server block:
#
#   sudo cp deploy/nginx/erp-static-cache.conf /etc/nginx/snippets/erp-static-cache.conf
#   # then add this line inside the `server { ... }` that listens on 443:
#   #   include snippets/erp-static-cache.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# ---------------------------------------------------------------------------
# Every block below uses `^~` prefix matching, not regex, and that is the whole
# point.
#
# This server also reverse-proxies the public Next.js site at /website, and
# Next.js serves its own hashed assets from /website/_next/static/*.css and
# *.js. A regex location like `~* \.(css|js)$` would take precedence over the
# `location /website/` proxy and try to serve those from disk with try_files —
# breaking the marketing site's styling entirely. `^~` on specific Laravel-only
# prefixes cannot collide with /website.
#
# Cache-Control is set with add_header only, never alongside `expires`, because
# `expires` emits its own Cache-Control: max-age and the response would carry
# two conflicting Cache-Control headers.
# ---------------------------------------------------------------------------

# Vite output: filenames are content-hashed, so a new build is a new URL and
# these never need revalidating.
location ^~ /build/ {
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Vendor assets (AdminLTE, Bootstrap, FontAwesome) are versioned by release
# rather than by filename, so a week then revalidate.
location ^~ /vendor/ {
    access_log off;
    add_header Cache-Control "public, max-age=604800" always;

    # ~6 MB of CSS/JS source maps live under here and expose original sources.
    # Nested inside the prefix block because `^~` would otherwise win over a
    # top-level `\.map$` regex and serve them anyway.
    location ~* \.map$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    try_files $uri =404;
}

# Uploaded branding, gallery and student images. Filenames are timestamp
# prefixed, so a replacement gets a new URL.
location ^~ /images/ {
    access_log off;
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
}

# Files served off the storage symlink (legacy local uploads). These were the one
# public asset path with no caching at all, so student photos on the local disk
# were re-downloaded on every list scroll.
#
# Photos on the S3 public disk go out via the /media/ signed route instead, which
# is dynamic — MediaController sets Cache-Control on that redirect itself.
location ^~ /storage/ {
    access_log off;
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
}

# Legacy Laravel Mix output.
location ^~ /css/ {
    access_log off;
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
}

location ^~ /js/ {
    access_log off;
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
}
