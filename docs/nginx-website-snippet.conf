# Add inside server { } for erp.royalkingsschools.sc.ke
#
# The public site now lives at https://royalkingsschools.sc.ke/ (see
# docs/nginx-public-website.conf). This block keeps uploaded media under
# public/website/ reachable, and sends every other /website URL to the
# public domain.
#
# Do NOT use "location /website" — it also matches /website-cms.

location = /website {
    return 301 https://royalkingsschools.sc.ke/;
}

location /website/ {
    root /var/www/erp/public;
    try_files $uri @public_website;
}

location @public_website {
    rewrite ^/website/?(.*)$ https://royalkingsschools.sc.ke/$1 permanent;
}
