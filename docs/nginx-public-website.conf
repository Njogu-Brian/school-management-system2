# Public marketing site at the domain root.
# Next.js (PM2) listens on 127.0.0.1:3001 with an empty base path.
#
# TLS: Cloudflare connects to the origin on port 443. Use a Cloudflare Origin
# Certificate (SSL/TLS -> Origin Server -> Create, hostnames
# royalkingsschools.sc.ke and *.royalkingsschools.sc.ke, 15 years).
# Save the certificate and key on the server as:
#   /etc/ssl/cloudflare/royalkingsschools.sc.ke.pem
#   /etc/ssl/cloudflare/royalkingsschools.sc.ke.key
# Then set Cloudflare SSL/TLS mode to Full (strict).
#
# Until that certificate is installed, a temporary self-signed cert at the
# same path lets nginx start. Use Cloudflare SSL mode Full (not Flexible)
# with the temporary cert, then switch to Full (strict).

server {
    listen 80;
    listen 443 ssl;
    server_name www.royalkingsschools.sc.ke;

    ssl_certificate /etc/ssl/cloudflare/royalkingsschools.sc.ke.pem;
    ssl_certificate_key /etc/ssl/cloudflare/royalkingsschools.sc.ke.key;

    return 301 https://royalkingsschools.sc.ke$request_uri;
}

server {
    listen 80;
    server_name royalkingsschools.sc.ke;
    return 301 https://royalkingsschools.sc.ke$request_uri;
}

server {
    listen 443 ssl;
    server_name royalkingsschools.sc.ke;

    ssl_certificate /etc/ssl/cloudflare/royalkingsschools.sc.ke.pem;
    ssl_certificate_key /etc/ssl/cloudflare/royalkingsschools.sc.ke.key;

    client_max_body_size 20M;

    # Old Mobirise pages
    location = /index.html { return 301 /; }
    location = "/About Us.html" { return 301 /about; }
    location = "/Contac Us.html" { return 301 /contact; }
    location = /Fees.html { return 301 /fees; }
    location = /Gallery.html { return 301 /gallery; }
    location = "/Enroll Now.html" { return 301 /admissions; }

    # Archived Mobirise images and downloads (fee PDF, old image URLs)
    location /assets/images/ {
        alias /var/www/erp/public/legacy-mobirise/assets/images/;
        access_log off;
        expires 30d;
    }

    location /assets/files/ {
        alias /var/www/erp/public/legacy-mobirise/assets/files/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
